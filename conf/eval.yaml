batch_size: 128

eval:
  # Only used to locate the run directory that holds the generations.
  checkpoint_path: runs/4f065c86-4a19-4401-891c-b7094f71ad31/checkpoint.pt

  # Classifier features produce a domain-specific Fréchet distance, not standard FID.
  fid_backbone: fashion-mnist_cnn
  classifier: runs/classifier_experiments/models/cnn/C3/best.pt
  # Accuracy uses a separate MLP so it isn't judged by the FID feature network.
  accuracy_classifier: runs/classifier_experiments/models/mlp/M2/best.pt

  # root: data/imagenet-10k/imagenet_subtrain # data/imagenet-10k/imagenet_subtrain
  # image_dataset: True

  # Generation and sampler settings are read from <run>/<generation_id>/generation_cfg.yaml.
  generation_id: ??? # pass eval.generation_id=<id> printed by generate_fashion.py
  real_dataset: data/fashion-mnist

data:
  n_classes: 10
