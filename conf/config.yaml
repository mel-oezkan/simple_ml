batch_size: 512
epochs: 20
learning_rate: 0.0001
sample_every: 4
num_workers: 4

model: 
  n_blocks: 6
  emb_dim: 128
  patch_size: 2
  image_size: 28
  n_classes: 10
  out_channels: 1
  mlp_scalar: 4
  T: 1000
  pos_emb: sinusoidal_1d #options: sinusoidal_1d, sinusoidal_2d
  attn_heads: 8

training:
  compile: True
  from_checkpoint: True
  checkpoint_path: "runs/a58c1482-067e-4d84-beea-2fd9e6a3cbc6/checkpoint.pt"

ema:
  decay: 0.986

debug:
  active: True
  debug_n: 1 # int or null
  batch_size: 1
  epochs: 1
  skip_test: True
